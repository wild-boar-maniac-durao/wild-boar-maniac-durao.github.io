<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CONTABILIDADE 24h</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:light dark;
  --bg:#fbfaf8; --fg:#1a1815; --mut:#6f6a62; --line:#e6e1d8; --card:#fff;
  --acc:#8a5a2b; --acc-soft:#f0e6d8;
  --ok:#2f7d4f; --warn:#a86a12; --bad:#a33a2a;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#14130f; --fg:#ece8e1; --mut:#9a938a; --line:#2b2822; --card:#1c1a15;
  --acc:#d69a5c; --acc-soft:#2a2119;
  --ok:#5fbf85; --warn:#e0a94a; --bad:#e0705c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:2.5rem 1.25rem 5rem}
main{max-width:66rem;margin:0 auto}

header{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;margin-bottom:.5rem}
.mascote{width:104px;height:auto;color:var(--acc);flex:none;
  transform-origin:50% 82%;

  animation:javali-anda 3.2s steps(3,end) infinite}
@keyframes javali-anda{
  0%   {transform:translate(0,0)       rotate(0deg)   scaleX(1)}
  8%   {transform:translate(8px,-8px)  rotate(-6deg)  scaleX(1)}
  16%  {transform:translate(17px,3px)  rotate(5deg)   scaleX(1)}
  24%  {transform:translate(24px,-10px)rotate(-7deg)  scaleX(1)}
  32%  {transform:translate(31px,2px)  rotate(6deg)   scaleX(1)}
  40%  {transform:translate(33px,-5px) rotate(-2deg)  scaleX(1)}
  47%  {transform:translate(32px,4px)  rotate(11deg)  scaleX(-1)}
  55%  {transform:translate(25px,-9px) rotate(-5deg)  scaleX(-1)}
  63%  {transform:translate(18px,4px)  rotate(7deg)   scaleX(-1)}
  71%  {transform:translate(10px,-10px)rotate(-6deg)  scaleX(-1)}
  79%  {transform:translate(3px,3px)   rotate(8deg)   scaleX(-1)}
  87%  {transform:translate(-2px,-6px) rotate(-9deg)  scaleX(-1)}
  94%  {transform:translate(1px,5px)   rotate(4deg)   scaleX(1)}
  100% {transform:translate(0,0)       rotate(0deg)   scaleX(1)}
}

.titulo-frase{margin-top:1.75rem}
.frase{margin:.85rem 0 1.6rem;padding:.85rem 1.1rem;border:1px dashed var(--line);
  border-radius:12px;background:var(--card);color:var(--mut);font-size:.95rem;
  min-height:3.1rem;display:flex;align-items:center;gap:.6rem}
.frase span{transition:opacity .25s}
.frase.trocando span{opacity:0}

#corrida{position:fixed;left:-170px;bottom:9%;width:130px;height:auto;
  color:var(--acc);pointer-events:none;z-index:60;opacity:0}
#corrida.correndo{animation:javali-corre 2.8s steps(12,end) 1}
@keyframes javali-corre{
  0%   {opacity:0;transform:translate(0,0)          rotate(0deg)}
  5%   {opacity:1;transform:translate(5vw,-12px)    rotate(-8deg)}
  21%  {opacity:1;transform:translate(23vw,7px)     rotate(7deg)}
  37%  {opacity:1;transform:translate(41vw,-14px)   rotate(-9deg)}
  53%  {opacity:1;transform:translate(59vw,6px)     rotate(8deg)}
  69%  {opacity:1;transform:translate(77vw,-13px)   rotate(-7deg)}
  85%  {opacity:1;transform:translate(95vw,5px)     rotate(10deg)}
  96%  {opacity:1;transform:translate(112vw,-9px)   rotate(-6deg)}
  100% {opacity:0;transform:translate(125vw,0)      rotate(0deg)}
}

#javalada{position:fixed;inset:0;z-index:9999;background:var(--bg);overflow:hidden}
#javalada .wrap{position:absolute;left:0;will-change:transform;
  animation:sc-atravessa linear infinite}
#javalada .flip{display:block}
#javalada svg{display:block;width:100%;height:auto;color:var(--acc);
  will-change:transform;animation:sc-pula steps(4,end) infinite}
@keyframes sc-atravessa{
  from{transform:translateX(-25vw)}
  to  {transform:translateX(125vw)}
}
@keyframes sc-pula{
  0%  {transform:translateY(0)     rotate(0deg)}
  25% {transform:translateY(-42px) rotate(-11deg)}
  50% {transform:translateY(6px)   rotate(9deg)}
  75% {transform:translateY(-24px) rotate(-6deg)}
  100%{transform:translateY(0)     rotate(0deg)}
}

#fim-da-pagina{position:relative;min-height:170px;margin-top:3.5rem}
#fim-da-pagina footer{position:relative;z-index:2;margin-top:0}
#rodape-javalis{position:absolute;left:0;right:0;bottom:0;height:130px;
  pointer-events:none;z-index:1;overflow:hidden}
#rodape-javalis .andarilho{position:absolute;bottom:0;color:var(--acc);
  will-change:transform}
#rodape-javalis .flip{display:block}
#rodape-javalis svg{display:block;width:100%;height:auto;
  animation:javali-passo .62s steps(3,end) infinite}
#rodape-javalis .parado svg{animation-play-state:paused}
@keyframes javali-passo{
  0%  {transform:translateY(0)    rotate(0deg)}
  33% {transform:translateY(-6px) rotate(-3deg)}
  66% {transform:translateY(3px)  rotate(3deg)}
  100%{transform:translateY(0)    rotate(0deg)}
}
.tatuagem{fill:currentColor;font-family:ui-sans-serif,system-ui,sans-serif;
  font-weight:700;opacity:.9;paint-order:stroke;stroke:var(--bg);stroke-width:4px}

.titulo h1{font-size:1.6rem;margin:0;letter-spacing:-.02em;font-weight:650}
.titulo p{margin:.15rem 0 0;color:var(--mut);font-size:.9rem}

.pulso{display:inline-flex;align-items:center;gap:.55rem;margin-top:.6rem;
  padding:.4rem .75rem;border:1px solid var(--line);border-radius:999px;
  background:var(--card);font-size:.85rem;box-shadow:var(--shadow)}
.bolha{width:.55rem;height:.55rem;border-radius:50%;background:var(--mut);flex:none}
.pulso.vivo .bolha{background:var(--ok);animation:bate 2s ease-in-out infinite}
.pulso.atraso .bolha{background:var(--warn)}
.pulso.morto .bolha{background:var(--bad)}
.pulso.vivo{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.pulso.morto{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
@keyframes bate{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.pulso.vivo .bolha{animation:none}}
.pulso b{font-weight:600}
.pulso .quando{color:var(--mut)}

h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);
  font-weight:650;margin:2.75rem 0 .75rem}
.tiles{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  margin-top:1.75rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:.9rem 1rem;box-shadow:var(--shadow)}
.tile .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.tile .v{font-size:1.45rem;font-weight:650;margin-top:.15rem;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .n{font-size:.75rem;color:var(--mut);margin-top:.1rem}

.quadro{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow)}
.rolagem{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--line);
  white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
  font-weight:650;background:color-mix(in srgb,var(--card) 70%,var(--bg))}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--acc-soft) 45%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.msg{white-space:normal;min-width:14rem;max-width:24rem;color:var(--mut);font-size:.84rem}
td.vazio{color:var(--mut);opacity:.45}
.selo{font-size:.7rem;padding:.1rem .45rem;border-radius:5px;border:1px solid currentColor;
  white-space:nowrap}
.s-sim{color:var(--acc)} .s-nao{color:var(--mut);opacity:.7} .s-ind{color:var(--warn)}
.barra{height:.45rem;border-radius:3px;background:var(--acc);opacity:.7;min-width:2px}

.ferramentas{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.75rem}
input[type=search]{flex:1;min-width:11rem;padding:.45rem .7rem;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:.88rem}
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:1px}
.pag{display:flex;gap:.4rem;align-items:center;justify-content:space-between;
  padding:.65rem .8rem;flex-wrap:wrap;
  background:color-mix(in srgb,var(--card) 70%,var(--bg));border-top:1px solid var(--line)}
.pag .info{color:var(--mut);font-size:.82rem}
button{padding:.35rem .7rem;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font:inherit;font-size:.84rem;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
.paginas{display:flex;gap:.3rem;flex-wrap:wrap}
.paginas button.atual{background:var(--acc);color:var(--bg);border-color:var(--acc)}

.aviso{padding:1.25rem;border:1px dashed var(--line);border-radius:12px;color:var(--mut);
  font-size:.88rem;background:var(--card)}
.aviso code{background:var(--bg);padding:.1rem .35rem;border-radius:4px;font-size:.9em}
footer{margin-top:3.5rem;padding-top:1.25rem;border-top:1px solid var(--line);
  color:var(--mut);font-size:.8rem}
</style>
</head>

<script>
"use strict";
const POR_PAGINA = 25;
const RECARGA_MS = 30000;

let dados = [], pagina = 1, desc = true, filtro = "";

function parseCSV(texto, sep = ";") {
  texto = texto.replace(/^﻿/, "");
  const linhas = [];
  let campo = "", linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; }
        else aspas = false;
      } else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else if (c !== "\r") campo += c;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  if (!linhas.length) return [];
  const cab = linhas.shift().map(s => s.trim());
  return linhas.filter(l => l.length > 1).map(l => {
    const o = {};
    cab.forEach((k, i) => o[k] = (l[i] ?? "").trim());
    return o;
  });
}

const num = s => parseFloat(String(s || "0").replace(/\./g, "").replace(",", ".")) || 0;
const brl = v => "R$ " + v.toLocaleString("pt-BR", {minimumFractionDigits: 2,
                                                   maximumFractionDigits: 2});
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function haQuanto(seg) {
  if (!isFinite(seg)) return "—";
  if (seg < 0) seg = 0;
  if (seg < 60) return `há ${Math.round(seg)} segundo${Math.round(seg) === 1 ? "" : "s"}`;
  const m = Math.floor(seg / 60);
  if (m < 60) return `há ${m} minuto${m === 1 ? "" : "s"}`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h} hora${h === 1 ? "" : "s"}`;
  const d = Math.floor(h / 24);
  return `há ${d} dia${d === 1 ? "" : "s"}`;
}

async function carregar() {
  try {
    const r = await fetch("doacoes.csv", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    dados = parseCSV(await r.text()).map(l => ({
      quando: l.quando || "", video: l.video || "", tempo: l.tempo || "",
      valor: num(l.valor), doador: l.doador || "?", mensagem: l.mensagem || "",
      repetido: (l.repetido || "nao").toLowerCase(),
      score: num(l.score), n_doador: parseInt(l.n_doador || "1", 10),
      identidade: l.identidade || ""
    }));
    document.getElementById("erro").style.display = "none";
    desenhar();
  } catch (e) {

    const local = location.protocol === "file:";
    document.getElementById("erro").style.display = "";
    document.getElementById("erro").innerHTML = local
      ? "Esta página lê <code>doacoes.csv</code> por <code>fetch</code>, que o "
        + "navegador bloqueia em <code>file://</code>. Sirva a pasta por HTTP: "
        + "<code>python -m http.server -d publico 8080</code> e abra "
        + "<code>http://localhost:8080</code>. Publicada em Pages funciona direto."
      : "Não consegui ler <code>doacoes.csv</code>: " + esc(e.message);
  }
}

async function bater() {
  const el = document.getElementById("pulso");
  const alvo = document.getElementById("hb");
  const q = document.getElementById("hbq");
  try {
    const r = await fetch("heartbeat.json", {cache: "no-store"});
    if (!r.ok) throw new Error();
    const hb = await r.json();
    const seg = (Date.now() / 1000) - hb.epoch;

    const iv = Math.max(60, hb.intervalo || 120);
    alvo.textContent = haQuanto(seg);
    q.textContent = hb.ts ? "(" + hb.ts.replace("T", " ").slice(0, 19) + ")" : "";
    el.className = "pulso " + (seg < iv * 2.5 ? "vivo" : seg < iv * 6 ? "atraso" : "morto");
    el.title = seg < iv * 2.5 ? "o monitor está rodando"
      : seg < iv * 6 ? "sem sinal ha algumas batidas"
      : "o monitor parece parado";
  } catch {
    alvo.textContent = "sem sinal";
    q.textContent = "";
    el.className = "pulso morto";
  }
}

function desenhar() {
  const agora = Date.now();
  const dt = l => l.quando ? new Date(l.quando.replace(" ", "T")).getTime() : NaN;
  const dentro = h => dados.filter(l => { const t = dt(l); return isFinite(t) && agora - t <= h * 3600e3; });

  const tot = dados.reduce((s, l) => s + l.valor, 0);
  const d1 = dentro(24), d7 = dentro(24 * 7);
  const hoje = dados.filter(l => l.quando.slice(0, 10) === new Date().toISOString().slice(0, 10));

  const ids = new Set(dados.map(l => l.identidade || l.doador));
  const decid = dados.filter(l => l.repetido !== "indeterminado");
  const reps = dados.filter(l => l.repetido === "sim");
  const pRep = decid.length ? reps.length / decid.length * 100 : 0;

  document.getElementById("sub").textContent =
    `${dados.length} lançamentos · ${ids.size} doadores`;

  const tile = (k, v, n) => `<div class="tile"><div class="k">${esc(k)}</div>
    <div class="v">${esc(v)}</div>${n ? `<div class="n">${esc(n)}</div>` : ""}</div>`;
  document.getElementById("tiles").innerHTML =
      tile("Total", brl(tot), dados.length + " doações")
    + tile("Hoje", brl(hoje.reduce((s, l) => s + l.valor, 0)), hoje.length + " doações")
    + tile("Últimas 24 h", brl(d1.reduce((s, l) => s + l.valor, 0)), d1.length + " doações")
    + tile("Últimos 7 dias", brl(d7.reduce((s, l) => s + l.valor, 0)), d7.length + " doações")
    + tile("Ticket médio", dados.length ? brl(tot / dados.length) : "—")
    + tile("Repetidas", pRep.toFixed(0) + "%", `${reps.length}/${decid.length} decidíveis`);

  const dias = {};
  for (const l of dados) {
    const d = l.quando.slice(0, 10) || "sem data";
    (dias[d] ||= {n: 0, tot: 0, rep: 0, ids: new Set()});
    dias[d].n++; dias[d].tot += l.valor;
    if (l.repetido === "sim") dias[d].rep++;
    dias[d].ids.add(l.identidade || l.doador);
  }
  const ord = Object.entries(dias).sort((a, b) => b[0].localeCompare(a[0]));
  const maxd = Math.max(1, ...ord.map(([, v]) => v.tot));
  document.querySelector("#tdias tbody").innerHTML = ord.length ? ord.map(([d, v]) => `
    <tr><td>${esc(d.split("-").reverse().join("/"))}</td>
    <td class="num">${v.n}</td><td class="num">${v.rep}</td>
    <td class="num">${v.ids.size}</td><td class="num">${esc(brl(v.tot))}</td>
    <td class="num">${esc(brl(v.tot / v.n))}</td>
    <td><div class="barra" style="width:${(v.tot / maxd * 100).toFixed(0)}%"></div></td></tr>`
  ).join("") : `<tr><td colspan="7" class="vazio">sem lançamentos</td></tr>`;

  desenharTabela();
}

function filtradas() {
  const f = filtro.trim().toLowerCase();
  let l = f ? dados.filter(d => (d.doador + " " + d.mensagem).toLowerCase().includes(f))
            : dados.slice();
  l.sort((a, b) => (a.quando || "").localeCompare(b.quando || ""));
  if (desc) l.reverse();
  return l;
}

function desenharTabela() {
  const todas = filtradas();
  const paginas = Math.max(1, Math.ceil(todas.length / POR_PAGINA));
  pagina = Math.min(pagina, paginas);
  const ini = (pagina - 1) * POR_PAGINA;
  const fatia = todas.slice(ini, ini + POR_PAGINA);

  const selo = l => l.repetido === "indeterminado"
    ? `<span class="selo s-ind" title="nome genérico: não dá para saber se é a mesma pessoa">anônimo</span>`
    : l.repetido === "sim"
      ? `<span class="selo s-sim" title="semelhança x distintividade do nome">${l.n_doador}ª · ${l.score.toFixed(0)}%</span>`
      : `<span class="selo s-nao">novo</span>`;

  document.querySelector("#ttodas tbody").innerHTML = fatia.length ? fatia.map(l => `
    <tr><td>${esc(l.quando.replace("T", " ") || "—")}</td>
    <td class="num">${esc(brl(l.valor))}</td><td>${esc(l.doador)}</td>
    ${l.mensagem ? `<td class="msg" title="${esc(l.mensagem)}">${esc(l.mensagem)}</td>`
                 : `<td class="vazio">—</td>`}
    <td>${selo(l)}</td></tr>`).join("")
    : `<tr><td colspan="5" class="vazio">nada encontrado</td></tr>`;

  document.getElementById("info").textContent = todas.length
    ? `${ini + 1}–${Math.min(ini + POR_PAGINA, todas.length)} de ${todas.length}`
    : "0 de 0";

  const alvo = document.getElementById("paginas");
  alvo.innerHTML = "";
  const bt = (txt, p, cls, on = true) => {
    const b = document.createElement("button");
    b.textContent = txt;
    if (cls) b.className = cls;
    b.disabled = !on;
    if (on) b.onclick = () => { pagina = p; desenharTabela();
                                window.scrollTo({top: document.getElementById("ttodas").offsetTop - 80,
                                                 behavior: "smooth"}); };
    alvo.appendChild(b);
  };
  bt("‹", pagina - 1, "", pagina > 1);
  const de = Math.max(1, pagina - 2), ate = Math.min(paginas, pagina + 2);
  if (de > 1) bt("1", 1);
  if (de > 2) alvo.insertAdjacentHTML("beforeend", `<span class="info">…</span>`);
  for (let p = de; p <= ate; p++) bt(String(p), p, p === pagina ? "atual" : "");
  if (ate < paginas - 1) alvo.insertAdjacentHTML("beforeend", `<span class="info">…</span>`);
  if (ate < paginas) bt(String(paginas), paginas);
  bt("›", pagina + 1, "", pagina < paginas);
}

document.getElementById("busca").addEventListener("input", e => {
  filtro = e.target.value; pagina = 1; desenharTabela();
});
document.getElementById("ordem").addEventListener("click", e => {
  desc = !desc;
  e.target.textContent = desc ? "Mais recentes primeiro" : "Mais antigas primeiro";
  pagina = 1; desenharTabela();
});

let frases = [], trocas = 0, ultima = -1, timerFrases = null;

async function carregarFrases() {
  try {
    const r = await fetch("frases.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);

    const buf = await r.arrayBuffer();
    let texto = new TextDecoder("utf-8").decode(buf);
    if (texto.includes("�")) texto = new TextDecoder("windows-1252").decode(buf);
    const j = JSON.parse(texto.replace(/^﻿/, ""));

    const lista = Array.isArray(j) ? j : j.frases;
    if (Array.isArray(lista) && lista.length) frases = lista.filter(f => String(f).trim());
    const seg = Number(Array.isArray(j) ? 0 : j.segundos);
    return seg > 0 ? seg * 1000 : 8000;
  } catch (e) {

    return 8000;
  }
}

function sortear() {
  if (frases.length < 2) return 0;
  let i;
  do { i = Math.floor(Math.random() * frases.length); } while (i === ultima);
  return i;
}

function trocarFrase() {
  const cx = document.getElementById("frase");
  const txt = document.getElementById("frase-txt");
  cx.classList.add("trocando");
  setTimeout(() => {
    ultima = sortear();
    txt.textContent = frases[ultima] || "";
    cx.classList.remove("trocando");
    if (++trocas % 3 === 0) correr();
  }, 250);
}

function correr() {
  const j = document.getElementById("corrida");
  if (!j) return;
  j.classList.remove("correndo");
  void j.offsetWidth;
  j.classList.add("correndo");
}

document.getElementById("corrida")
  .addEventListener("animationend", e => e.target.classList.remove("correndo"));

(async () => {
  const ms = await carregarFrases();

  if (!frases.length) { document.getElementById("bloco-frases").style.display = "none"; return; }
  ultima = sortear();
  document.getElementById("frase-txt").textContent = frases[ultima] || "";
  timerFrases = setInterval(trocarFrase, ms);
})();

const SC_JAVALIS = 30;

async function ehSantaCatarina() {
  const q = new URLSearchParams(location.search);
  if (q.get("sc") === "1") return true;
  if (q.get("sc") === "0") return false;

  for (const [url, campo] of [["https://ipwho.is/", "region_code"],
                              ["https://ipapi.co/json/", "region_code"]]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j[campo]) return String(j[campo]).toUpperCase() === "SC";
    } catch (e) {  }
  }
  return false;
}

function soltarJavalada(n = SC_JAVALIS) {
  const molde = document.getElementById("corrida");
  if (!molde) return;
  const palco = document.createElement("div");
  palco.id = "javalada";

  for (let i = 0; i < n; i++) {
    const wrap = document.createElement("div");
    wrap.className = "wrap";
    const flip = document.createElement("span");
    flip.className = "flip";

    const svg = molde.cloneNode(true);
    svg.removeAttribute("id");
    svg.classList.remove("correndo");
    svg.style.opacity = "1";

    const largura = 70 + Math.random() * 120;
    const daDireita = Math.random() < 0.5;
    wrap.style.top = (Math.random() * 92) + "%";
    wrap.style.width = largura + "px";
    wrap.style.animationDuration = (3 + Math.random() * 7).toFixed(2) + "s";
    wrap.style.animationDelay = (-Math.random() * 10).toFixed(2) + "s";
    if (daDireita) wrap.style.animationDirection = "reverse";

    flip.style.transform = daDireita ? "scaleX(-1)" : "";
    svg.style.animationDuration = (0.35 + Math.random() * 0.5).toFixed(2) + "s";
    svg.style.animationDelay = (-Math.random() * 2).toFixed(2) + "s";

    flip.appendChild(svg);
    wrap.appendChild(flip);
    palco.appendChild(wrap);
  }

  document.body.appendChild(palco);
  const m = document.querySelector("main");
  if (m) m.style.display = "none";
}

function javaliAndarilho(nome) {
  const molde = document.getElementById("corrida");
  const wrap = document.createElement("div");
  wrap.className = "andarilho";
  const flip = document.createElement("span");
  flip.className = "flip";

  const svg = molde.cloneNode(true);
  svg.removeAttribute("id");
  svg.classList.remove("correndo");
  svg.style.opacity = "1";
  svg.style.animation = "";

  const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
  t.setAttribute("class", "tatuagem");
  t.setAttribute("x", "142");
  t.setAttribute("y", "92");
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("font-size", nome.length > 8 ? "17" : "22");
  t.textContent = nome;
  svg.appendChild(t);

  flip.appendChild(svg);
  wrap.appendChild(flip);
  return { wrap, flip, texto: t };
}

const LARG_ANDARILHO = 130;
let bichosRodape = [], palcoRodape = null;

function passoRodape(agora, dt) {

  const larguraFaixa = palcoRodape ? palcoRodape.clientWidth : innerWidth;
  const limite = Math.max(0, larguraFaixa - LARG_ANDARILHO);
  for (const b of bichosRodape) {
    if (agora >= b.proximaDecisao) {
      const d = Math.random();
      b.parado = d < 0.25;
      if (!b.parado && d > 0.7) b.dir *= -1;
      if (!b.parado) b.vel = 22 + Math.random() * 18;
      b.proximaDecisao = agora + 1200 + Math.random() * 3500;
      b.wrap.classList.toggle("parado", b.parado);
    }
    if (!b.parado) {
      b.x += b.dir * b.vel * dt;
      if (b.x <= 0) { b.x = 0; b.dir = 1; }
      if (b.x >= limite) { b.x = limite; b.dir = -1; }
    }
    b.wrap.style.transform = `translateX(${b.x.toFixed(1)}px)`;

    if (b.dir < 0) {
      b.flip.style.transform = "scaleX(-1)";
      b.texto.setAttribute("transform", "translate(284 0) scale(-1 1)");
    } else {
      b.flip.style.transform = "";
      b.texto.removeAttribute("transform");
    }
  }
}

function passearNoRodape() {
  const fim = document.getElementById("fim-da-pagina");
  if (!fim) return;
  const palco = document.createElement("div");
  palco.id = "rodape-javalis";
  fim.appendChild(palco);
  palcoRodape = palco;

  const larg = palco.clientWidth || innerWidth;
  bichosRodape = ["Roberto", "Lucas Matheus"].map((nome, i) => {
    const j = javaliAndarilho(nome);
    j.wrap.style.width = LARG_ANDARILHO + "px";
    palco.appendChild(j.wrap);
    return { ...j, x: larg * (i ? 0.6 : 0.15), dir: i ? -1 : 1,
             vel: 22 + Math.random() * 18, proximaDecisao: 0, parado: false };
  });

  let antes = performance.now();
  (function quadro(agora) {

    const dt = Math.min((agora - antes) / 1000, 0.1);
    antes = agora;
    passoRodape(agora, dt);
    requestAnimationFrame(quadro);
  })(performance.now());
}

(async () => {
  if (await ehSantaCatarina()) { soltarJavalada(); return; }
  passearNoRodape();
})();

carregar(); bater();
setInterval(bater, 15000);
setInterval(carregar, RECARGA_MS);
