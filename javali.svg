<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Javali">
  <g fill="none" stroke="currentColor" stroke-width="3.4"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Contorno unico: focinho rombudo, cerdas do dorso fazendo parte da
         silhueta (soltas por cima viravam serra) e patas curtas e grossas,
         que e a proporcao real do bicho. -->
    <path d="M22 73
             L33 70
             Q43 67 49 57
             L56 47
             L57 25 L74 47
             L81 39 L86 23 L93 38 L100 20 L108 36 L116 23 L124 40
             L134 31 L142 45
             Q162 40 180 49
             Q197 58 201 74
             Q204 89 196 100
             L194 125 L180 125 L179 102
             Q170 104 162 104
             L161 125 L147 125 L147 101
             Q128 106 110 102
             L109 125 L95 125 L94 100
             Q82 98 74 95
             L73 125 L59 125 L59 93
             Q46 92 36 91
             L24 89 Z"
          fill="currentColor" fill-opacity=".08"/>

    <!-- presa: crescente para cima, projetando alem da linha do focinho -->
    <path d="M40 91 Q27 87 24 68" stroke-width="4.4"/>

    <!-- vinco da orelha -->
    <path d="M63 42 L64 30" stroke-width="2.4"/>

    <!-- ombro e anca: sem elas o corpo vira uma mancha sem volume -->
    <path d="M86 52 Q78 74 84 97" stroke-width="2.2" opacity=".55"/>
    <path d="M168 56 Q178 76 173 99" stroke-width="2.2" opacity=".55"/>

    <!-- linha da boca -->
    <path d="M25 86 Q32 85 40 83" stroke-width="2.4"/>

    <!-- narina, na face rombuda do focinho -->
    <ellipse cx="28" cy="78" rx="3" ry="2.4" fill="currentColor" stroke="none"/>

    <!-- olho -->
    <circle cx="51" cy="62" r="3" fill="currentColor" stroke="none"/>

    <!-- rabo enrolado -->
    <path d="M201 78 q11 3 9 12 q-2 8-10 6" stroke-width="2.8"/>

    <!-- cascos -->
    <path d="M59 125 h14 M95 125 h14 M147 125 h14 M180 125 h14" stroke-width="4.6"/>
  </g>
</svg>
